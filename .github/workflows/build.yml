name: Build FFmpeg iOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build FFmpeg iOS ARM64
    runs-on: macos-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Build environment
      # ============================================================

      - name: Show build environment
        run: |
          echo "=============================================="
          echo "Build environment"
          echo "=============================================="

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo ""
          echo "Architecture:"
          uname -m

      # ============================================================
      # Dependencies / build tools
      # ============================================================

      - name: Install build tools
        run: |
          brew update

          brew install \
            nasm \
            yasm \
            pkg-config \
            autoconf \
            automake \
            libtool \
            cmake \
            meson \
            ninja \
            perl

      # ============================================================
      # Build
      # ============================================================

      - name: Make build script executable
        run: |
          chmod +x scripts/build_ios.sh

      - name: Build FFmpeg
        run: |
          ./scripts/build_ios.sh

      # ============================================================
      # Verify
      # ============================================================

      - name: Verify XCFramework
        run: |
          echo "=============================================="
          echo "XCFramework verification"
          echo "=============================================="

          test -d output/ffmpeg.xcframework

          echo ""
          echo "XCFramework contents:"
          find output/ffmpeg.xcframework -maxdepth 3 -type f | sort

          echo ""
          echo "Binary:"
          file output/ffmpeg.xcframework/ios-arm64/libffmpeg_device.a

      # ============================================================
      # Package
      # ============================================================

      - name: Package XCFramework
        run: |
          cd output
          zip -r ffmpeg-ios.zip ffmpeg.xcframework

      # ============================================================
      # Upload
      # ============================================================

      - name: Upload FFmpeg XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-ios
          path: output/ffmpeg-ios.zip
          if-no-files-found: error
